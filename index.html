<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Стоп-мошенник</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #0f1420);
    --bg2: var(--tg-theme-secondary-bg-color, #171e2e);
    --text: var(--tg-theme-text-color, #eef2fa);
    --hint: var(--tg-theme-hint-color, #8a94a8);
    --accent: var(--tg-theme-button-color, #2f7cf6);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --card: color-mix(in srgb, var(--bg2) 85%, var(--text) 4%);
    --line: color-mix(in srgb, var(--text) 10%, transparent);
    --danger:#ef4655; --safe:#22b573; --warn:#f5a524;
    --r: 18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  body{min-height:100vh;overflow-x:hidden}
  .app{max-width:520px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .screen{display:none;animation:in .35s ease both}
  .screen.on{display:block}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* top bar */
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
  .shield{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(140deg,#2f7cf6,#7b4dff);color:#fff;box-shadow:0 6px 18px -6px #2f7cf6}
  .lang{display:flex;background:var(--bg2);border-radius:999px;padding:3px;border:1px solid var(--line)}
  .lang button{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--hint);transition:.2s}
  .lang button.on{background:var(--accent);color:var(--accent-text)}

  /* hero */
  .hero{position:relative;border-radius:24px;padding:22px 20px 20px;overflow:hidden;
    background:radial-gradient(120% 90% at 100% 0%,#7b4dff55,transparent 60%),radial-gradient(90% 80% at 0% 100%,#2f7cf655,transparent 60%),var(--bg2);
    border:1px solid var(--line)}
  .hero h1{font-size:26px;line-height:1.15;letter-spacing:-.02em;margin-bottom:8px}
  .hero p{color:var(--hint);margin-bottom:18px}
  .stat{display:flex;gap:10px;margin-bottom:18px}
  .stat div{flex:1;background:color-mix(in srgb,var(--bg) 60%,transparent);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
  .stat b{display:block;font-size:20px}
  .stat span{font-size:12px;color:var(--hint)}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:14px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-text);transition:transform .12s,filter .2s}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:var(--bg2);color:var(--text);border:1px solid var(--line)}
  .sec{margin:22px 0 10px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--hint)}
  .rules{display:grid;gap:8px}
  .rule{display:flex;gap:12px;align-items:flex-start;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .rule i{font-style:normal;font-size:20px;line-height:1}
  .disclaimer{margin-top:18px;font-size:12px;color:var(--hint);text-align:center}

  /* quiz */
  .qhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .back{width:36px;height:36px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;flex:none}
  .bar{flex:1;height:8px;background:var(--bg2);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2f7cf6,#7b4dff);border-radius:99px;transition:width .4s}
  .count{font-size:13px;color:var(--hint);font-variant-numeric:tabular-nums}

  .phone{background:var(--bg2);border:1px solid var(--line);border-radius:24px;padding:16px;min-height:300px;position:relative}
  .ctx{font-size:13px;color:var(--hint);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:12px;padding:8px 12px;margin-bottom:12px}
  .who{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .ava{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:none;background:linear-gradient(140deg,#3a4560,#262e42)}
  .who b{display:block}
  .who span{font-size:12px;color:var(--hint)}
  .call .ava{animation:ring 1.2s infinite}
  @keyframes ring{0%,100%{box-shadow:0 0 0 0 #22b57388}50%{box-shadow:0 0 0 10px #22b57300}}
  .bubble{background:var(--bg);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:12px 14px;font-size:15.5px;opacity:0;transform:translateY(6px);animation:pop .4s .15s forwards}
  .call .bubble{border-radius:18px;font-style:italic}
  @keyframes pop{to{opacity:1;transform:none}}
  .bubble mark{background:transparent;color:inherit;border-radius:4px;transition:background .4s,box-shadow .4s}
  .revealed .bubble mark{background:#ef465533;box-shadow:0 0 0 2px #ef465555}
  .revealed.safe .bubble mark{background:#22b57333;box-shadow:0 0 0 2px #22b57355}
  .typing{display:flex;gap:4px;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:18px;width:max-content}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--hint);animation:dot 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes dot{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}

  .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .choice{padding:16px 10px;border-radius:16px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;border:1.5px solid var(--line);background:var(--bg2);transition:.15s}
  .choice:active{transform:scale(.96)}
  .choice em{font-style:normal;font-size:24px}
  .choice.f{color:var(--danger)} .choice.s{color:var(--safe)}
  .choice[disabled]{opacity:.45}

  .verdict{margin-top:14px;border-radius:18px;padding:16px;border:1px solid var(--line);background:var(--bg2);animation:in .35s both}
  .verdict h3{display:flex;align-items:center;gap:8px;font-size:18px;margin-bottom:6px}
  .verdict.ok h3{color:var(--safe)} .verdict.bad h3{color:var(--danger)}
  .verdict p{color:var(--text);opacity:.9;margin-bottom:12px}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;margin-bottom:10px}
  .tag.f{background:#ef465522;color:var(--danger)} .tag.s{background:#22b57322;color:var(--safe)}
  .shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

  /* result */
  .ring{width:180px;height:180px;margin:10px auto 16px;position:relative}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:14;stroke-linecap:round}
  .ring .t{stroke:var(--bg2)}
  .ring .v{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
  .ring .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
  .ring .n b{font-size:44px;line-height:1;display:block}
  .ring .n span{font-size:13px;color:var(--hint)}
  .grade{text-align:center;font-size:22px;font-weight:800;margin-bottom:6px}
  .gsub{text-align:center;color:var(--hint);margin-bottom:18px}
  .mist{display:grid;gap:8px;margin-bottom:18px}
  .mist div{background:var(--bg2);border:1px solid var(--line);border-left:4px solid var(--danger);border-radius:12px;padding:10px 12px;font-size:14px}
  .row{display:grid;gap:10px}

  /* help */
  .steps{display:grid;gap:10px;counter-reset:s}
  .step{display:flex;gap:14px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:14px}
  .step::before{counter-increment:s;content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--accent);color:var(--accent-text)}
  .calls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
  .calls a{text-decoration:none;color:#fff;background:linear-gradient(140deg,#ef4655,#c2263a);border-radius:16px;padding:14px;text-align:center;font-weight:800;font-size:24px}
  .calls a span{display:block;font-size:12px;font-weight:600;opacity:.85}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:9}

  /* tools */
  .top-r{display:flex;gap:8px;align-items:center}
  .icon-btn{width:36px;height:36px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;font-size:17px;transition:.2s}
  .icon-btn.on{background:var(--accent);color:var(--accent-text);border-color:transparent}
  .tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .tool{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:118px;transition:.2s}
  .tool:active{transform:scale(.97)}
  .tool em{font-style:normal;font-size:26px;margin-bottom:4px}
  .tool b{font-size:15px;line-height:1.25}
  .tool span{font-size:12.5px;color:var(--hint);line-height:1.35}
  .tool.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--bg2))}
  .tool .sw{margin-top:auto;align-self:flex-start;width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;transition:.2s}
  .tool .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
  .tool.on .sw{background:var(--accent)} .tool.on .sw::after{left:19px}
  .say{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--accent);padding:7px 12px;border-radius:99px;background:color-mix(in srgb,var(--accent) 13%,transparent);margin-top:10px}
  .no-tts .say{display:none!important}

  /* checker */
  .lead{color:var(--hint);margin-bottom:12px}
  textarea{width:100%;min-height:130px;resize:vertical;font:inherit;font-size:15.5px;color:var(--text);background:var(--bg2);border:1.5px solid var(--line);border-radius:16px;padding:14px;outline:none;transition:border-color .2s}
  textarea:focus{border-color:var(--accent)}
  .chips{display:flex;gap:8px;overflow-x:auto;margin:10px -16px 14px;padding:0 16px 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:none;font-size:13px;padding:7px 12px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);color:var(--text)}
  .gauge{position:relative;width:230px;margin:6px auto 0}
  .gauge svg{width:100%;display:block}
  #gArc{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
  #needle{transform-box:view-box;transform-origin:100px 100px;transition:transform 1.1s cubic-bezier(.3,1.4,.4,1)}
  .gv{text-align:center;margin-top:-6px}
  .gv b{font-size:38px;line-height:1}
  .gv small{font-size:16px;color:var(--hint)}
  .risk{text-align:center;margin:6px 0 16px}
  .risk h2{font-size:22px;letter-spacing:-.01em}
  .risk p{color:var(--hint)}
  .lvl0 h2{color:var(--safe)} .lvl1 h2{color:var(--warn)} .lvl2 h2{color:var(--danger)}
  .marked{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;white-space:pre-wrap;word-break:break-word}
  .marked mark{background:#ef465533;box-shadow:0 0 0 2px #ef465555;color:inherit;border-radius:4px}
  .flags{display:grid;gap:8px;margin-bottom:14px}
  .flag{display:flex;gap:12px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;animation:in .35s both}
  .flag i{font-style:normal;font-size:18px;line-height:1.3}
  .flag b{display:block;margin-bottom:2px}
  .flag span{font-size:14px;opacity:.85}
  .tip{border-radius:14px;padding:12px 14px;margin-bottom:14px;font-weight:600}
  .lvl0 .tip,.tip.lvl0{background:#22b57320} .tip.lvl1{background:#f5a52422} .tip.lvl2{background:#ef465522}

  /* режим для пожилых */
  body.big{font-size:19px;--hint:color-mix(in srgb,var(--text) 78%,transparent);--line:color-mix(in srgb,var(--text) 22%,transparent)}
  body.big .hero h1{font-size:31px}
  body.big .hero p,body.big .lead{font-size:18px}
  body.big .stat{display:none}
  body.big .btn{padding:20px;font-size:20px;border-radius:18px}
  body.big .bubble{font-size:21px;line-height:1.5}
  body.big .who b{font-size:19px}
  body.big .choice{padding:24px 10px;font-size:20px}
  body.big .choice em{font-size:34px}
  body.big .rule,body.big .step,body.big .flag span,body.big .mist div{font-size:18px}
  body.big .verdict p{font-size:19px}
  body.big .verdict h3{font-size:22px}
  body.big .sec{font-size:15px}
  body.big .tool b{font-size:17px} body.big .tool span{font-size:14.5px}
  body.big .say{font-size:16px;padding:10px 16px}
  body.big textarea{font-size:19px;min-height:160px}
  body.big .chips button{font-size:16px;padding:10px 14px}
  body.big .disclaimer{font-size:14px}
</style>
</head>
<body>
<div class="app">

  <div class="top">
    <div class="brand"><div class="shield">🛡</div><span data-t="brand"></span></div>
    <div class="top-r">
      <button class="icon-btn" id="bigBtn" aria-label="Крупный режим">👓</button>
      <div class="lang"><button data-lang="ru">RU</button><button data-lang="sah">САХА</button></div>
    </div>
  </div>

  <!-- HOME -->
  <section class="screen on" id="home">
    <div class="hero">
      <h1 data-t="heroTitle"></h1>
      <p data-t="heroText"></p>
      <div class="stat">
        <div><b id="nScen">8</b><span data-t="statSit"></span></div>
        <div><b>2</b><span data-t="statMin"></span></div>
        <div><b id="best">—</b><span data-t="statBest"></span></div>
      </div>
      <button class="btn" id="start"><span data-t="start"></span> →</button>
    </div>

    <div class="tools">
      <button class="tool" id="toCheck"><em>🔍</em><b data-t="checkCard"></b><span data-t="checkCardSub"></span></button>
      <button class="tool" id="bigCard"><em>👓</em><b data-t="bigCard"></b><span data-t="bigCardSub"></span><i class="sw"></i></button>
    </div>

    <div class="sec" data-t="rulesTitle"></div>
    <div class="rules" id="rules"></div>
    <button class="say" data-say="rules">🔊 <span data-t="listen"></span></button>

    <div class="sec"></div>
    <button class="btn ghost" id="toHelp">🆘 <span data-t="helpBtn"></span></button>
    <p class="disclaimer" data-t="disclaimer"></p>
  </section>

  <!-- QUIZ -->
  <section class="screen" id="quiz">
    <div class="qhead">
      <button class="back" id="quit">✕</button>
      <div class="bar"><i id="barFill"></i></div>
      <div class="count" id="count"></div>
    </div>
    <div class="phone" id="phone"></div>
    <div class="choices" id="choices">
      <button class="choice f" data-a="1"><em>🚨</em><span data-t="isFraud"></span></button>
      <button class="choice s" data-a="0"><em>✅</em><span data-t="isSafe"></span></button>
    </div>
    <div id="verdict"></div>
  </section>

  <!-- RESULT -->
  <section class="screen" id="result">
    <div class="ring">
      <svg viewBox="0 0 180 180"><circle class="t" cx="90" cy="90" r="76"/><circle class="v" id="ringV" cx="90" cy="90" r="76"/></svg>
      <div class="n"><div><b id="score">0</b><span id="scoreOf"></span></div></div>
    </div>
    <div class="grade" id="grade"></div>
    <div class="gsub" id="gsub"></div>
    <div class="sec" id="mistTitle" data-t="mistakes"></div>
    <div class="mist" id="mist"></div>
    <div class="row">
      <button class="btn" id="share">📤 <span data-t="share"></span></button>
      <button class="btn ghost" id="again">↻ <span data-t="again"></span></button>
      <button class="btn ghost" id="toHelp2">🆘 <span data-t="helpBtn"></span></button>
    </div>
  </section>

  <!-- HELP -->
  <section class="screen" id="help">
    <div class="qhead"><button class="back" id="helpBack">←</button><b data-t="helpTitle"></b></div>
    <div class="calls">
      <a href="tel:102">102<span data-t="police"></span></a>
      <a href="tel:112">112<span data-t="emergency"></span></a>
    </div>
    <div class="steps" id="steps"></div>
    <button class="say" data-say="steps">🔊 <span data-t="listen"></span></button>
  </section>

  <!-- CHECK -->
  <section class="screen" id="check">
    <div class="qhead"><button class="back" id="checkBack">←</button><b data-t="checkTitle"></b></div>
    <div id="checkForm">
      <p class="lead" data-t="checkLead"></p>
      <textarea id="msg"></textarea>
      <div class="chips" id="chips"></div>
      <button class="btn" id="checkBtn">🔍 <span data-t="checkBtn"></span></button>
      <p class="disclaimer" data-t="checkNote"></p>
    </div>
    <div id="checkRes" style="display:none">
      <div class="gauge">
        <svg viewBox="0 0 200 112">
          <defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#22b573"/><stop offset=".5" stop-color="#f5a524"/><stop offset="1" stop-color="#ef4655"/></linearGradient></defs>
          <path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="var(--bg2)" stroke-width="16" stroke-linecap="round"/>
          <path id="gArc" d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="url(#gg)" stroke-width="16" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
          <g id="needle"><line x1="100" y1="100" x2="100" y2="38" stroke="var(--text)" stroke-width="4" stroke-linecap="round"/><circle cx="100" cy="100" r="8" fill="var(--text)"/></g>
        </svg>
        <div class="gv"><b id="gNum">0</b><small>%</small></div>
      </div>
      <div class="risk" id="risk"><h2></h2><p></p></div>
      <div class="sec" data-t="yourMsg"></div>
      <div class="marked" id="marked"></div>
      <div class="sec" id="flagsTitle" data-t="flagsFound"></div>
      <div class="flags" id="flags"></div>
      <div class="tip" id="tip"></div>
      <div class="row">
        <button class="say" data-say="check" style="justify-self:center;margin:0 0 4px">🔊 <span data-t="listen"></span></button>
        <button class="btn" id="checkAgain">↻ <span data-t="checkAgain"></span></button>
        <button class="btn ghost" id="toHelp3">🆘 <span data-t="helpBtn"></span></button>
      </div>
    </div>
  </section>
</div>
<canvas class="confetti" id="confetti"></canvas>

<script>
/* ===== Настройки ===== */
const CONFIG = {
  BOT_USERNAME: "" // например "stop_moshennik_bot" — для кнопки «Поделиться»
};

/* ===== Тексты интерфейса (RU / Саха) ===== */
const I18N = {
  ru: {
    brand:"Стоп-мошенник",
    heroTitle:"Смогут ли вас обмануть?",
    heroText:"8 реальных ситуаций: звонки, СМС и сообщения. Решите — мошенник это или нет.",
    statSit:"ситуаций", statMin:"минуты", statBest:"лучший",
    start:"Пройти тренажёр",
    rulesTitle:"3 главных правила",
    rules:[["🔒","Никому не называйте код из СМС — даже «сотруднику банка» или «полиции»."],
           ["💸","Полиция и банк никогда не просят переводить деньги на «безопасный счёт»."],
           ["📞","Сомневаетесь — положите трубку и перезвоните сами по официальному номеру."]],
    helpBtn:"Меня обманули — что делать?",
    disclaimer:"Демо-прототип. Ситуации основаны на распространённых схемах мошенников.",
    isFraud:"Мошенник", isSafe:"Безопасно",
    call:"Входящий звонок", sms:"СМС", chat:"Сообщение",
    right:"Верно!", wrong:"Ошибка",
    wasFraud:"Это мошенники", wasSafe:"Это безопасно",
    next:"Дальше", finish:"Результат",
    of:"из",
    grades:[["Вас не обмануть 🏆","Отличный результат — поделитесь тренажёром с близкими."],

/* ===== Язык ===== */
function applyLang(){
  document.documentElement.lang = lang==="sah"?"sah":"ru";
  document.querySelectorAll("[data-t]").forEach(el=>{ const v=T(el.dataset.t); if(typeof v==="string") el.textContent=v; });
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on", b.dataset.lang===lang));
  $("#rules").innerHTML = T("rules").map(([e,t])=>`<div class="rule"><i>${e}</i><span>${t}</span></div>`).join("");
  $("#steps").innerHTML = T("steps").map(t=>`<div class="step"><span>${t}</span></div>`).join("");
  const b = store.get("best"); $("#best").textContent = b ? `${b}/${SCEN.length}` : "—";
  $("#nScen").textContent = SCEN.length;
  if ($("#quiz").classList.contains("on")) renderQ(true);
  if ($("#result").classList.contains("on")) renderResult(false);
  extraLang();
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; store.set("lang",lang); haptic(); applyLang(); });

/* ===== Навигация ===== */
const stack = ["home"];
function show(id, push=true){
  document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on", s.id===id));
  if (push) stack.push(id);
  window.scrollTo({top:0});
  stopSay();
  if (tg){ stack.length>1 && id!=="home" ? tg.BackButton.show() : tg.BackButton.hide(); }
}
function back(){ stack.pop(); show(stack[stack.length-1]||"home", false); if(stack.length===0) stack.push("home"); }
if (tg) tg.BackButton.onClick(back);

/* ===== Тренажёр ===== */
function start(){
  order = SCEN.map((_,k)=>k).sort(()=>Math.random()-.5);
  i=0; score=0; wrong=[];
  stack.length=1; show("quiz"); renderQ();
}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function renderQ(keepVerdict){
  const s = SCEN[order[i]];
  $("#count").textContent = `${i+1}/${SCEN.length}`;
  $("#barFill").style.width = `${(i/SCEN.length)*100}%`;
  const html = esc(s.text[lang]).replace(/\[\[(.+?)\]\]/g,"<mark>$1</mark>");
  const phone = $("#phone");
  const answered = keepVerdict && phone.dataset.answered==="1";
  phone.className = "phone " + s.type + (answered ? " revealed"+(s.fraud?"":" safe") : "");
  phone.innerHTML = `
    ${s.ctx ? `<div class="ctx">💡 ${s.ctx[lang]}</div>` : ""}
    <div class="who"><div class="ava">${s.ava}</div><div><b>${s.from[lang]}</b><span>${T(s.type)}${s.num?" · "+s.num:""}</span></div></div>
    <div class="bubble">${html}</div>
    <button class="say" data-say="q">🔊 ${T("listen")}</button>`;
  if (!keepVerdict){
    phone.dataset.answered="0";
    $("#verdict").innerHTML="";
    document.querySelectorAll(".choice").forEach(b=>b.disabled=false);
    const bub = phone.querySelector(".bubble");
    bub.style.display="none";
    const typing = document.createElement("div"); typing.className="typing"; typing.innerHTML="<i></i><i></i><i></i>";
    bub.before(typing);
    setTimeout(()=>{ typing.remove(); bub.style.display=""; if (big) say(sayText("q")); }, 700);
  } else if (answered) { renderVerdict(); }
}
function answer(a){
  const phone = $("#phone"); if (phone.dataset.answered==="1") return;
  const s = SCEN[order[i]]; const ok = (a===1)===s.fraud;
  phone.dataset.answered="1"; phone.dataset.ok = ok?"1":"0";
  if (ok) score++; else wrong.push(order[i]);
  haptic(ok?"ok":"err");
  phone.classList.add("revealed"); if(!s.fraud) phone.classList.add("safe");
  if (!ok){ phone.classList.remove("shake"); void phone.offsetWidth; phone.classList.add("shake"); }
  document.querySelectorAll(".choice").forEach(b=>b.disabled=true);
  $("#barFill").style.width = `${((i+1)/SCEN.length)*100}%`;
  renderVerdict();
  if (big) say(sayText("v"));
}
function renderVerdict(){
  const s = SCEN[order[i]]; const ok = $("#phone").dataset.ok==="1";
  const last = i===SCEN.length-1;
  $("#verdict").innerHTML = `
    <div class="verdict ${ok?"ok":"bad"}">
      <h3>${ok?"✅":"❌"} ${T(ok?"right":"wrong")}</h3>
      <span class="tag ${s.fraud?"f":"s"}">${T(s.fraud?"wasFraud":"wasSafe")}</span>
      <p>${s.why[lang]}</p>
      <button class="say" data-say="v" style="margin:0 0 12px">🔊 ${T("listen")}</button>
      <button class="btn" id="nextBtn">${T(last?"finish":"next")} →</button>
    </div>`;
  $("#nextBtn").onclick = ()=>{ haptic(); if(last){ finish(); } else { i++; renderQ(); } };
  setTimeout(()=>$("#verdict").scrollIntoView({behavior:"smooth",block:"nearest"}),50);
}
document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>answer(+b.dataset.a));

/* ===== Результат ===== */
function finish(){
  const best = +(store.get("best")||0); if (score>best) store.set("best",score);
  show("result"); renderResult(true);
}
function renderResult(animate){
  const n = SCEN.length, p = score/n;
  const g = p===1?0 : p>=.75?1 : p>=.4?2 : 3;
  const color = ["#22b573","#2f7cf6","#f5a524","#ef4655"][g];
  const C = 2*Math.PI*76, v = $("#ringV");
  v.style.stroke = color; v.style.strokeDasharray = C;
  if (animate){ v.style.transition="none"; v.style.strokeDashoffset=C; void v.offsetWidth; v.style.transition=""; }
  requestAnimationFrame(()=>v.style.strokeDashoffset = C*(1-p));
  $("#scoreOf").textContent = `${T("of")} ${n}`;
  if (animate){ let k=0; const t=setInterval(()=>{ $("#score").textContent=k; if(k++>=score) clearInterval(t); }, 90); }
  else $("#score").textContent = score;
  $("#grade").textContent = T("grades")[g][0];
  $("#gsub").textContent = T("grades")[g][1];
  $("#mistTitle").style.display = wrong.length ? "" : "none";
  $("#mist").innerHTML = wrong.map(k=>`<div><b>${SCEN[k].from[lang]}</b><br>${SCEN[k].why[lang]}</div>`).join("");
  if (animate && g===0) confetti();
  if (animate) haptic(g<=1?"ok":"err");
}
function shareIt(){
  const text = T("shareText")(score, SCEN.length);
  const url = CONFIG.BOT_USERNAME ? `https://t.me/${CONFIG.BOT_USERNAME}` : location.href;
  const link = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`;
  if (tg && tg.openTelegramLink) tg.openTelegramLink(link);
  else if (navigator.share) navigator.share({text, url}).catch(()=>{});
  else window.open(link, "_blank");
}

/* ===== Конфетти ===== */
function confetti(){
  const c=$("#confetti"), x=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const P=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*5,
    vx:-2+Math.random()*4,vy:2+Math.random()*4,a:Math.random()*6,c:["#2f7cf6","#7b4dff","#22b573","#f5a524","#ef4655"][Math.random()*5|0]}));
  let f=0; (function loop(){ x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore();});
    if(f++<200) requestAnimationFrame(loop); else x.clearRect(0,0,c.width,c.height); })();
}

const BRANDS = {gosuslug:"gosuslugi.ru", sber:"sberbank.ru", vtb:"vtb.ru", tinkoff:"tbank.ru", tbank:"tbank.ru", alfa:"alfabank.ru",
  mvd:"мвд.рф", nalog:"nalog.gov.ru", pochta:"pochta.ru", avito:"avito.ru", ozon:"ozon.ru", wildberr:"wildberries.ru", wb:"wildberries.ru", telegram:"telegram.org"};
const OFFICIAL = ["gosuslugi.ru","sberbank.ru","sberbank.com","sber.ru","vtb.ru","tbank.ru","tinkoff.ru","alfabank.ru","mvd.ru","xn--b1aew.xn--p1ai",
  "nalog.gov.ru","pochta.ru","avito.ru","ozon.ru","wildberries.ru","wb.ru","telegram.org","t.me"];
const SHORT = ["bit.ly","clck.ru","tinyurl.com","t.ly","goo.su","cutt.ly","is.gd","vk.cc","u.to","rb.gy"];
const isOfficial = d => OFFICIAL.some(o => d===o || d.endsWith("."+o));
// \w в JS не видит кириллицу — заменяем на «любая буква/цифра» с флагом u
const uni = re => new RegExp(re.source.replace(/\\w/g, "[\\p{L}\\p{N}]"), "giu");
RULES.forEach(r => { if (r.re) r.re = uni(r.re); });

function analyze(text){
  const hits = [], spans = [];
  const add = (rule, s, e, extra) => { spans.push([s,e]); if(!hits.some(h=>h.r.id===rule.id && !extra)) hits.push({r:rule, extra}); };
  const R = id => RULES.find(r=>r.id===id);
  // «назовите/продиктуйте код», но не «никому не сообщайте код»
  const codeRe = /(назов|продикт|сообщ|скаж|отправ|пришл|скин|введ|напиш)\w*[^.!?\n]{0,25}код\w*|код\w*[^.!?\n]{0,25}(назов|продикт|сообщ|скаж|отправ|пришл|скин|напиш)\w*/gi;
  const codeU = uni(codeRe);
  for (const m of text.matchAll(codeU)) {
    const before = text.slice(Math.max(0,m.index-12), m.index).toLowerCase();
    if (/(^|\s)не\s*$/.test(before)) continue;
    add(R("code"), m.index, m.index+m[0].length);
  }
  RULES.filter(r=>r.re).forEach(r=>{ for (const m of text.matchAll(r.re)) add(r, m.index, m.index+m[0].length); });
  // ссылки
  const urlRe = /\b((?:https?:\/\/)?(?:[a-z0-9-]+\.)+[a-z]{2,}(?:\/[^\s]*)?)/gi;
  for (const m of text.matchAll(urlRe)) {
    const host = m[1].replace(/^https?:\/\//i,"").split(/[\/?#]/)[0].toLowerCase().replace(/^www\./,"");
    if (!/[a-z]/.test(host.split(".").pop())) continue;
    const s = m.index, e = m.index+m[1].length;
    const brand = Object.keys(BRANDS).find(b => host.replace(/[^a-z]/g,"").includes(b));
    if (brand && !isOfficial(host)) { spans.push([s,e]); hits.push({r:R("fake"), extra:[host, BRANDS[brand]]}); }
    else if (SHORT.some(x=>host===x)) add(R("short"), s, e);
    else if (!isOfficial(host)) add(R("link"), s, e);
  }
  const ids = [...new Set(hits.map(h=>h.r.id))];
  const risk = Math.min(100, ids.reduce((a,id)=>a+R(id).w, 0));
  return { hits, spans, risk, level: risk>=50 ? 2 : risk>=20 ? 1 : 0 };
}

function markText(text, spans){
  const sorted = spans.slice().sort((a,b)=>a[0]-b[0]); const merged = [];
  for (const sp of sorted){ const l = merged[merged.length-1]; if (l && sp[0] <= l[1]) l[1] = Math.max(l[1], sp[1]); else merged.push(sp.slice()); }
  let out = "", pos = 0;
  for (const [s,e] of merged){ out += esc(text.slice(pos,s)) + "<mark>" + esc(text.slice(s,e)) + "</mark>"; pos = e; }
  return out + esc(text.slice(pos));
}

let lastCheck = null;
function runCheck(){
  const text = $("#msg").value.trim();
  if (text.length < 3){ $("#msg").focus(); $("#msg").classList.remove("shake"); void $("#msg").offsetWidth; $("#msg").classList.add("shake"); haptic("err"); return; }
  lastCheck = { text, res: analyze(text) };
  $("#checkForm").style.display = "none"; $("#checkRes").style.display = "";
  renderCheck(true);
  haptic(lastCheck.res.level===2 ? "err" : lastCheck.res.level===0 ? "ok" : "");
  window.scrollTo({top:0});
  if (big) say(sayText("check"));
}
function renderCheck(animate){
  if (!lastCheck) return;
  const { text, res } = lastCheck;
  const arc = $("#gArc"), nd = $("#needle");
  if (animate){ arc.style.transition = nd.style.transition = "none"; arc.style.strokeDashoffset = 100; nd.style.transform = "rotate(-90deg)"; void arc.getBoundingClientRect(); arc.style.transition = nd.style.transition = ""; }
  requestAnimationFrame(()=>{ arc.style.strokeDashoffset = 100 - res.risk; nd.style.transform = `rotate(${-90 + res.risk*1.8}deg)`; });
  if (animate){ let k=0; const t=setInterval(()=>{ k=Math.min(res.risk,k+3); $("#gNum").textContent=k; if(k>=res.risk) clearInterval(t); }, 25); }
  else $("#gNum").textContent = res.risk;
  const [h,p] = T("levels")[res.level];
  $("#risk").className = "risk lvl"+res.level; $("#risk").innerHTML = `<h2>${h}</h2><p>${p}</p>`;
  $("#marked").innerHTML = markText(text, res.spans);
  $("#flagsTitle").style.display = res.hits.length ? "" : "none";
  $("#flags").innerHTML = res.hits.map((x,k)=>{
    const d = x.r.d[lang]; const desc = typeof d === "function" ? d(...x.extra) : d;
    return `<div class="flag" style="animation-delay:${.15+k*.08}s"><i>${x.r.ic}</i><div><b>${x.r.t[lang]}</b><span>${esc(desc)}</span></div></div>`;
  }).join("");
  $("#tip").className = "tip lvl"+res.level; $("#tip").textContent = T("tips")[res.level];
}
function resetCheck(){ $("#checkForm").style.display = ""; $("#checkRes").style.display = "none"; $("#msg").value = ""; lastCheck = null; stopSay(); }

/* ===== Озвучка ===== */
const TTS = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
if (!TTS) document.body.classList.add("no-tts");
function stopSay(){ try{ if (TTS) speechSynthesis.cancel(); }catch(e){} }
function say(text){
  if (!TTS || !text) return;
  stopSay();
  const u = new SpeechSynthesisUtterance(text.replace(/\[\[|\]\]/g,"").replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu,""));
  u.lang = "ru-RU"; u.rate = big ? 0.88 : 1;
  const v = speechSynthesis.getVoices().find(v=>/^ru/i.test(v.lang)); if (v) u.voice = v;
  speechSynthesis.speak(u);
}
function sayText(kind){
  if (kind==="q"){ const s = SCEN[order[i]]; return `${s.from[lang]}. ${s.text[lang]}`; }
  if (kind==="v"){ const s = SCEN[order[i]]; const ok = $("#phone").dataset.ok==="1"; return `${T(ok?"right":"wrong")}. ${T(s.fraud?"wasFraud":"wasSafe")}. ${s.why[lang]}`; }
  if (kind==="rules") return T("rules").map(r=>r[1]).join(" ");
  if (kind==="steps") return T("steps").map((s,k)=>`${k+1}. ${s}`).join(" ");
  if (kind==="check" && lastCheck){
    const r = lastCheck.res; const [h,p] = T("levels")[r.level];
    return `${h}. ${p} ` + r.hits.map(x=>x.r.t[lang]).join(". ") + ". " + T("tips")[r.level];
  }
  return "";
}
document.addEventListener("click", e=>{ const b = e.target.closest("[data-say]"); if (b){ haptic(); say(sayText(b.dataset.say)); } });

  $("#msg").placeholder = T("checkPh");
  $("#chips").innerHTML = T("examples").map((l,k)=>`<button data-ex="${k}">${l}</button>`).join("");
  $("#chips").querySelectorAll("button").forEach(b=>b.onclick=()=>{ $("#msg").value = EXAMPLES[+b.dataset.ex]; haptic(); });
  if ($("#check").classList.contains("on")) renderCheck(false);
}
$("#toCheck").onclick = ()=>{ haptic(); resetCheck(); show("check"); };
$("#checkBtn").onclick = runCheck;
$("#checkAgain").onclick = ()=>{ haptic(); resetCheck(); setTimeout(()=>$("#msg").focus(),50); };
$("#checkBack").onclick = back;
$("#toHelp3").onclick = ()=>{ haptic(); show("help"); };
applyBig();

/* ===== Кнопки ===== */
$("#start").onclick = ()=>{ haptic(); start(); };
$("#again").onclick = ()=>{ haptic(); start(); };
$("#quit").onclick = ()=>{ stack.length=1; show("home",false); applyLang(); };
$("#toHelp").onclick = $("#toHelp2").onclick = ()=>{ haptic(); show("help"); };
$("#helpBack").onclick = back;
$("#share").onclick = shareIt;

applyLang();
</script>
